<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">A3S Lab — the operating system for collective intelligence</title>
  <desc id="desc">A3S Lab turns team contributions into crystal intelligence through a governed loop of context, capability, evidence, and reuse, with policy and receipts flowing through every task.</desc>

