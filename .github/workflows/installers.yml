name: Installers

on:
  push:
    paths:
      - ".gitattributes"
      - ".gitmodules"
      - "crates/cli"
      - "install.sh"
      - "install.ps1"
      - "scripts/test-install.sh"
      - "scripts/test-install.ps1"
      - "scripts/ensure-dev-submodules.sh"
      - "scripts/test-ensure-dev-submodules.sh"
      - "justfile"
      - ".github/workflows/installers.yml"
      - "README.md"
  pull_request:
    paths:
      - ".gitattributes"
      - ".gitmodules"
      - "crates/cli"
      - "install.sh"
      - "install.ps1"
      - "scripts/test-install.sh"
      - "scripts/test-install.ps1"
      - "scripts/ensure-dev-submodules.sh"
      - "scripts/test-ensure-dev-submodules.sh"
      - "justfile"
      - ".github/workflows/installers.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  CLI_RELEASE_REPOSITORY: A3S-Lab/CLI

jobs:
  unix-tests:
    name: Unix fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the pinned CLI
        shell: bash
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init crates/cli

      - name: Check shell syntax
        run: |
          sh -n install.sh
          sh -n scripts/ensure-dev-submodules.sh
          bash -n scripts/test-install.sh
          bash -n scripts/test-ensure-dev-submodules.sh

      - name: Run installer fixtures
        run: bash scripts/test-install.sh

      - name: Run development submodule preflight fixtures
        run: bash scripts/test-ensure-dev-submodules.sh

  windows-tests:
    name: Windows fixtures
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize the pinned CLI
        shell: bash
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init crates/cli

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $files = 'install.ps1', 'scripts/test-install.ps1'
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              throw ($errors | ForEach-Object { $_.ToString() } | Out-String)
            }
          }

      - name: Test with Windows PowerShell 5.1
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-install.ps1

      - name: Test with PowerShell 7
        shell: pwsh
        run: ./scripts/test-install.ps1

  unix-release-smoke:
    name: ${{ matrix.name }} release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS
            os: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect published CLI release
        id: cli-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags="$(gh api --paginate \
            "repos/${CLI_RELEASE_REPOSITORY}/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')"
          if printf '%s\n' "$tags" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping live installer smoke until a stable CLI release is published"
          fi

      - name: Install latest release
        if: steps.cli-release.outputs.available == 'true'
        env:
          A3S_GITHUB_TOKEN: ${{ github.token }}
          A3S_INSTALL_DIR: ${{ runner.temp }}/a3s-smoke/bin
        run: sh install.sh --no-modify-path

      - name: Verify binary
        if: steps.cli-release.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/a3s-smoke/bin/a3s"
          version="$("$binary" --version | awk '{ print $2 }')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

  windows-release-smoke:
    name: Windows x64 release
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect published CLI release
        id: cli-release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tags = @(& gh api --paginate `
            "repos/$env:CLI_RELEASE_REPOSITORY/releases?per_page=100" `
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name')
          if ($LASTEXITCODE -ne 0) {
            throw "failed to query published releases"
          }
          $available = @($tags | Where-Object { $_ -match '^v\d+\.\d+\.\d+$' }).Count -gt 0
          "available=$($available.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $available) {
            Write-Host "::notice::Skipping live installer smoke until a stable CLI release is published"
          }

      - name: Install and verify latest release
        if: steps.cli-release.outputs.available == 'true'
        shell: powershell
        env:
          A3S_GITHUB_TOKEN: ${{ github.token }}
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'a3s-smoke\bin'
          & .\install.ps1 -InstallDir $installDir
          $binary = Join-Path $installDir 'a3s.exe'
          $output = (& $binary --version | Out-String).Trim()
          if ($output -notmatch '^a3s (\d+\.\d+\.\d+)$') {
            throw "unexpected version output: $output"
          }
          $versionText = $Matches[1]
          $installedVersion = [version]$versionText
          $supportManifest = Join-Path $installDir 'support\managed-srt\package.json'
          if (Test-Path -LiteralPath $supportManifest -PathType Leaf) {
            $supportCli = Join-Path $installDir 'support\managed-srt\node_modules\@anthropic-ai\sandbox-runtime\dist\cli.js'
            if (-not (Test-Path -LiteralPath $supportCli -PathType Leaf)) {
              throw "managed sandbox support is incomplete: $supportCli"
            }
          }
          $env:A3S_STATE_HOME = Join-Path $env:RUNNER_TEMP 'a3s-smoke\state'
          $env:A3S_CACHE_HOME = Join-Path $env:RUNNER_TEMP 'a3s-smoke\cache'
          $env:A3S_RUNTIME_HOME = Join-Path $env:RUNNER_TEMP 'a3s-smoke\runtime'
          $env:A3S_WEBVIEW_INSTALL_DIR = Join-Path $env:RUNNER_TEMP 'a3s-smoke\components\webview'
          if ($installedVersion -lt [version]'0.10.0') {
            # Released CLIs before 0.10.0 require HOME even on native Windows.
            $env:HOME = Join-Path $env:RUNNER_TEMP 'a3s-smoke\legacy-home'
            New-Item -ItemType Directory -Force -Path $env:HOME | Out-Null
          } else {
            # Native Windows normally exposes USERPROFILE rather than HOME.
            Remove-Item Env:HOME -ErrorAction SilentlyContinue
          }
          $siblingWebview = Join-Path $installDir 'a3s-webview.exe'
          if (-not (Test-Path -LiteralPath $siblingWebview -PathType Leaf)) {
            & $binary --no-progress install webview
            if ($LASTEXITCODE -ne 0) {
              throw "WebView first-use installation failed with exit code $LASTEXITCODE"
            }
          }
          & $binary --no-progress doctor webview
          if ($LASTEXITCODE -ne 0) {
            throw "WebView doctor failed with exit code $LASTEXITCODE"
          }
