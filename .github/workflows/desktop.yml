name: Desktop

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'packages/ui/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/desktop-release-assets.mjs'
      - 'scripts/desktop-release-assets.test.mjs'
      - 'docs/desktop-release.md'
      - 'justfile'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'packages/ui/**'
      - '.github/workflows/desktop.yml'
      - '.github/workflows/desktop-release.yml'
      - 'scripts/desktop-release-assets.mjs'
      - 'scripts/desktop-release-assets.test.mjs'
      - 'docs/desktop-release.md'
      - 'justfile'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: 26.8.1
  TAURI_BUNDLER_DMG_IGNORE_CI: true

jobs:
  validate:
    name: Validate React and host
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Desktop and UI submodules
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init -- packages/ui apps/desktop

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run desktop checks
        working-directory: apps/desktop
        run: npm run check

      - name: Test release asset contract
        run: node --test scripts/desktop-release-assets.test.mjs

  package:
    name: Package ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            artifact: a3s-desktop-macos
            bundles: app,dmg
          - name: Linux x64
            os: ubuntu-22.04
            artifact: a3s-desktop-linux-x64
            bundles: appimage,deb
          - name: Windows x64
            os: windows-latest
            artifact: a3s-desktop-windows-x64
            bundles: nsis,msi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize Desktop and UI submodules
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init -- packages/ui apps/desktop

      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl file libfuse2 libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf xdg-utils

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Remove stale bundle output
        working-directory: apps/desktop
        run: npm run clean:package

      - name: Package native application
        working-directory: apps/desktop
        run: npm run package -- --bundles ${{ matrix.bundles }}

      - name: Smoke-test native sandbox
        working-directory: apps/desktop
        run: npm run smoke:sandbox

      - name: Verify packaged bundles
        working-directory: apps/desktop
        run: npm run verify:package -- --bundles ${{ matrix.bundles }}

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: apps/desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
