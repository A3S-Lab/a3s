name: A3S CLI Integration

on:
  push:
    branches: [main]
    paths:
      - ".gitmodules"
      - "crates/cli"
      - "install.sh"
      - "install.ps1"
      - ".github/scripts/check-cli-integration.sh"
      - ".github/workflows/a3s-cli-ci.yml"
      - ".github/workflows/relay-cli-release.yml"
  pull_request:
    branches: [main]
    paths:
      - ".gitmodules"
      - "crates/cli"
      - "install.sh"
      - "install.ps1"
      - ".github/scripts/check-cli-integration.sh"
      - ".github/workflows/a3s-cli-ci.yml"
      - ".github/workflows/relay-cli-release.yml"

permissions:
  contents: read

jobs:
  check:
    name: Pinned repository contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize the pinned CLI
        run: |
          git -c url."https://github.com/".insteadOf=git@github.com: \
            submodule update --init crates/cli
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify repository ownership
        run: bash .github/scripts/check-cli-integration.sh
      - name: Resolve the pinned CLI manifest
        run: cargo metadata --manifest-path crates/cli/Cargo.toml --locked --no-deps --format-version 1
