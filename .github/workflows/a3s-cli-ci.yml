name: A3S CLI CI
on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "skills/**"
      - ".gitmodules"
      - "install.sh"
      - "install.ps1"
      - ".github/scripts/check-cli-integration.sh"
      - ".github/scripts/check-release-state.sh"
      - ".github/scripts/test-check-release-state.sh"
      - ".github/scripts/use-published-a3s-crates.sh"
      - ".github/workflows/a3s-cli-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "skills/**"
      - ".gitmodules"
      - "install.sh"
      - "install.ps1"
      - ".github/scripts/check-cli-integration.sh"
      - ".github/scripts/check-release-state.sh"
      - ".github/scripts/test-check-release-state.sh"
      - ".github/scripts/use-published-a3s-crates.sh"
      - ".github/workflows/a3s-cli-ci.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - name: Verify root-owned CLI layout
        run: bash .github/scripts/check-cli-integration.sh
      - name: Use published A3S crates
        run: bash .github/scripts/use-published-a3s-crates.sh
      - name: Test release-state validation
        run: bash .github/scripts/test-check-release-state.sh
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release

  # Validate the TUI compiles for Windows + macOS so all three desktop
  # platforms can run `a3s code` (Linux is covered by `check` above).
  cross:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Use published A3S crates
        shell: bash
        run: bash .github/scripts/use-published-a3s-crates.sh
      - name: Test TUI exit regression
        if: runner.os == 'macOS'
        run: cargo test --locked --test tui_exit -- --nocapture
      - run: cargo build --locked --release
        env:
          # Cross-platform PR validation does not need LTO, and rustc 1.97 can
          # segfault while optimizing chromiumoxide_cdp on macOS arm64.
          CARGO_PROFILE_RELEASE_LTO: "false"
