<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">A3S architecture — one owner per concern</title>
  <desc id="desc">Product hosts set policy, Code Use and Flow compose agent work, Runtime and Power expose typed execution contracts, replaceable providers enforce them, and receipts return to the owning authority. ACL, identity, durable state, and compatibility locks cross every layer.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 5L0 10Z" fill="#0d74ce"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1198" height="698" rx="22" fill="#ffffff" stroke="#dcdee0"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="48" y="56" fill="#171717" font-size="36" font-weight="650" letter-spacing="-1">One owner per concern. Evidence returns to the owner.</text>
    <text x="48" y="90" fill="#60646c" font-size="20">Start with one local session; add capabilities, orchestration, isolation, inference, and fleet control progressively.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.1" fill="#60646c">
      <text x="48" y="156">HOST / POLICY</text>
      <text x="48" y="274">COMPOSE</text>
      <text x="48" y="444">EXECUTE</text>
      <text x="48" y="578">PROVIDERS</text>
    </g>

    <g>
      <rect x="218" y="122" width="716" height="76" rx="12" fill="#fafafa" stroke="#dcdee0"/>
      <g font-size="22" font-weight="620" fill="#171717" text-anchor="middle">
        <text x="285" y="169">CLI</text>
        <text x="428" y="169">Code</text>
        <text x="576" y="169">Web</text>
        <text x="724" y="169">Cloud</text>
        <text x="865" y="169">SDKs</text>
      </g>
      <g stroke="#dcdee0">
        <path d="M356 142V180M500 142V180M650 142V180M798 142V180"/>
      </g>
    </g>

    <path d="M576 198V226" stroke="#0d74ce" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="218" y="238" width="222" height="144" rx="12" fill="#171717"/>
      <text x="244" y="275" fill="#9ad0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">CODE</text>
      <text x="244" y="315" fill="#ffffff" font-size="22" font-weight="620">AgentSession</text>
      <text x="244" y="347" fill="#b0b4ba" font-size="18">model · tools · context</text>
      <text x="244" y="373" fill="#b0b4ba" font-size="18">permissions · HITL</text>

      <rect x="454" y="238" width="222" height="144" rx="12" fill="#f7fbff" stroke="#a8c8e8"/>
      <text x="480" y="275" fill="#0d74ce" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">USE</text>
      <text x="480" y="315" fill="#171717" font-size="22" font-weight="620">Capabilities</text>
      <text x="480" y="347" fill="#60646c" font-size="18">packages · grants</text>
      <text x="480" y="373" fill="#60646c" font-size="18">Tool · MCP · UI · data</text>

      <rect x="690" y="238" width="244" height="144" rx="12" fill="#fafafa" stroke="#dcdee0"/>
      <text x="716" y="275" fill="#0d74ce" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">FLOW</text>
      <text x="716" y="315" fill="#171717" font-size="22" font-weight="620">Durable work</text>
      <text x="716" y="347" fill="#60646c" font-size="18">runs · events · queues</text>
      <text x="716" y="373" fill="#60646c" font-size="18">replay · tests · receipts</text>

      <path d="M440 310H454M676 310H690" stroke="#0d74ce" stroke-width="3" marker-end="url(#arrow)"/>
    </g>

    <path d="M576 382V410" stroke="#0d74ce" stroke-width="3" marker-end="url(#arrow)"/>

    <g>
      <rect x="218" y="422" width="348" height="96" rx="12" fill="#171717"/>
      <text x="246" y="458" fill="#9ad0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">A3S RUNTIME</text>
      <text x="246" y="486" fill="#ffffff" font-size="20" font-weight="620">Task · Service</text>
      <text x="246" y="510" fill="#b0b4ba" font-size="18">typed lifecycle · observations</text>

      <rect x="584" y="422" width="350" height="96" rx="12" fill="#171717"/>
      <text x="612" y="458" fill="#9ad0ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">POWER + MOE</text>
      <text x="612" y="486" fill="#ffffff" font-size="20" font-weight="620">Serving · residency</text>
      <text x="612" y="510" fill="#b0b4ba" font-size="18">model equations · validation</text>
    </g>

    <path d="M576 518V548" stroke="#0d74ce" stroke-width="3" marker-end="url(#arrow)"/>

    <g font-size="20" font-weight="620" text-anchor="middle">
      <rect x="218" y="560" width="162" height="72" rx="10" fill="#fafafa" stroke="#dcdee0"/>
      <text x="299" y="603" fill="#171717">Process</text>
      <rect x="392" y="560" width="162" height="72" rx="10" fill="#fafafa" stroke="#dcdee0"/>
      <text x="473" y="603" fill="#171717">Container</text>
      <rect x="566" y="560" width="162" height="72" rx="10" fill="#fafafa" stroke="#dcdee0"/>
      <text x="647" y="603" fill="#171717">MicroVM</text>
      <rect x="740" y="560" width="194" height="72" rx="10" fill="#fafafa" stroke="#dcdee0"/>
      <text x="837" y="603" fill="#171717">Remote</text>
    </g>

    <g>
      <text x="978" y="142" fill="#60646c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.1">CROSS-CUTTING</text>

      <rect x="968" y="162" width="184" height="94" rx="12" fill="#f7fbff" stroke="#a8c8e8"/>
      <text x="992" y="198" fill="#171717" font-size="20" font-weight="620">ACL + identity</text>
      <text x="992" y="229" fill="#60646c" font-size="18">policy · provenance</text>

      <rect x="968" y="274" width="184" height="94" rx="12" fill="#f7fbff" stroke="#a8c8e8"/>
      <text x="992" y="310" fill="#171717" font-size="20" font-weight="620">Durable state</text>
      <text x="992" y="341" fill="#60646c" font-size="18">runs · artifacts</text>

      <rect x="968" y="386" width="184" height="94" rx="12" fill="#f7fbff" stroke="#a8c8e8"/>
      <text x="992" y="422" fill="#171717" font-size="20" font-weight="620">Evidence</text>
      <text x="992" y="453" fill="#60646c" font-size="18">health · receipts</text>

      <rect x="968" y="498" width="184" height="116" rx="12" fill="#f7fbff" stroke="#a8c8e8"/>
      <text x="992" y="534" fill="#171717" font-size="20" font-weight="620">Compatibility</text>
      <text x="992" y="565" fill="#60646c" font-size="18">exact revisions</text>
      <text x="992" y="591" fill="#60646c" font-size="18">protocol levels</text>

      <path d="M968 209H950V596H934" fill="none" stroke="#a8c8e8" stroke-width="2" stroke-dasharray="6 6"/>
      <path d="M968 321H950M968 433H950M968 556H950" stroke="#a8c8e8" stroke-width="2" stroke-dasharray="6 6"/>
    </g>

    <path d="M218 656H934" stroke="#8ebce8" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="218" y="682" fill="#60646c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">REQUESTS MOVE DOWN · RECEIPTS AND OBSERVATIONS MOVE BACK TO THE OWNER</text>
  </g>
</svg>
