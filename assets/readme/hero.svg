<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">A3S — one entry point for governed AI work</title>
  <desc id="desc">The a3s command branches into Code, Web and Work, Research, Use, Box, and Bench, with explicit policy and composable Rust foundations underneath.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101118"/>
      <stop offset="0.62" stop-color="#151725"/>
      <stop offset="1" stop-color="#1d1436"/>
    </linearGradient>
    <linearGradient id="brand" x1="58" y1="42" x2="1128" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2587f5"/>
      <stop offset="0.5" stop-color="#3b53dc"/>
      <stop offset="1" stop-color="#5420bd"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L8 4L0 8Z" fill="#6ca3ff"/>
    </marker>
  </defs>

  <rect width="1200" height="460" rx="24" fill="url(#background)"/>
  <path d="M0 364H1200" stroke="#2a2d35"/>
  <path d="M493 0V364" stroke="#2a2d35"/>

  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <g transform="translate(58 42)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M58 8A50 50 0 1 0 103 80" stroke="url(#brand)" stroke-width="9"/>
      <path d="M34 76L57 26L80 76M44 55H70" stroke="#f2f3f5" stroke-width="8"/>
      <path d="M13 75C31 62 44 63 58 72C72 81 88 78 106 61" stroke="url(#brand)" stroke-width="9"/>
    </g>

    <text x="180" y="72" fill="#a4a8b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="2">RUST-NATIVE AGENT PLATFORM</text>
    <text x="180" y="190" fill="#f2f3f5" font-size="88" font-weight="760" letter-spacing="-4">A3S</text>
    <text x="58" y="243" fill="#f2f3f5" font-size="35" font-weight="720" letter-spacing="-1.1">One entry point.</text>
    <text x="58" y="286" fill="url(#brand)" font-size="35" font-weight="720" letter-spacing="-1.1">Explicit boundaries.</text>

    <g transform="translate(58 316)">
      <rect width="380" height="62" rx="10" fill="#171820" stroke="#3a3d48"/>
      <text x="22" y="39" fill="#6ca3ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">$</text>
      <text x="49" y="39" fill="#f2f3f5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">a3s</text>
      <text x="105" y="39" fill="#a4a8b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">code</text>
      <path d="M176 31H349" stroke="#3a3d48" stroke-width="2"/>
      <circle cx="354" cy="31" r="5" fill="#6ca3ff"/>
    </g>
  </g>

  <g id="product-system" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="542" y="52" fill="#a4a8b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700" letter-spacing="1.8">PRODUCT SURFACES</text>
    <path d="M438 347H514V213H558" fill="none" stroke="#6ca3ff" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M562 88V310" stroke="#3a3d48" stroke-width="2"/>

    <g transform="translate(590 76)">
      <rect width="166" height="78" rx="10" fill="#171820" stroke="#2864e8" stroke-width="2"/>
      <text x="20" y="31" fill="#6ca3ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">01 / BUNDLED</text>
      <text x="20" y="61" fill="#f2f3f5" font-size="23" font-weight="720">Code</text>
    </g>
    <g transform="translate(772 76)">
      <rect width="166" height="78" rx="10" fill="#171820" stroke="#4034cc" stroke-width="2"/>
      <text x="20" y="31" fill="#8c83ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">02 / LOCAL</text>
      <text x="20" y="61" fill="#f2f3f5" font-size="23" font-weight="720">Web + Work</text>
    </g>
    <g transform="translate(954 76)">
      <rect width="188" height="78" rx="10" fill="#171820" stroke="#5420bd" stroke-width="2"/>
      <text x="20" y="31" fill="#ad87ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">03 / EVIDENCE</text>
      <text x="20" y="61" fill="#f2f3f5" font-size="23" font-weight="720">Research</text>
    </g>

    <g transform="translate(590 174)">
      <rect width="166" height="78" rx="10" fill="#171820" stroke="#3a3d48"/>
      <text x="20" y="31" fill="#a4a8b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">04 / CAPABILITY</text>
      <text x="20" y="61" fill="#f2f3f5" font-size="23" font-weight="720">Use</text>
    </g>
    <g transform="translate(772 174)">
      <rect width="166" height="78" rx="10" fill="#171820" stroke="#3a3d48"/>
      <text x="20" y="31" fill="#a4a8b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">05 / ISOLATE</text>
      <text x="20" y="61" fill="#f2f3f5" font-size="23" font-weight="720">Box</text>
    </g>
    <g transform="translate(954 174)">
      <rect width="188" height="78" rx="10" fill="#171820" stroke="#3a3d48"/>
      <text x="20" y="31" fill="#a4a8b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">06 / EVALUATE</text>
      <text x="20" y="61" fill="#f2f3f5" font-size="23" font-weight="720">Bench</text>
    </g>

    <path d="M562 115H578M562 213H578M562 310H578M756 115H772M938 115H954M756 213H772M938 213H954" stroke="#3a3d48" stroke-width="2"/>

    <rect x="590" y="276" width="552" height="68" rx="10" fill="#111d32" stroke="#2864e8"/>
    <text x="614" y="305" fill="#6ca3ff" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="1.2">SHARED CONTROL</text>
    <text x="614" y="331" fill="#f2f3f5" font-size="21" font-weight="700">ACL · policy · sessions · component lifecycle</text>
  </g>

  <g id="foundations" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="58" y="406" fill="#a4a8b2" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="1.4">COMPOSABLE LAYER</text>
    <text x="292" y="406" fill="#f2f3f5" font-size="19" font-weight="680">Runtime</text>
    <text x="388" y="406" fill="#f2f3f5" font-size="19" font-weight="680">Flow</text>
    <text x="454" y="406" fill="#f2f3f5" font-size="19" font-weight="680">Event</text>
    <text x="530" y="406" fill="#f2f3f5" font-size="19" font-weight="680">Lane</text>
    <text x="602" y="406" fill="#f2f3f5" font-size="19" font-weight="680">Memory</text>
    <text x="706" y="406" fill="#f2f3f5" font-size="19" font-weight="680">ORM</text>
    <text x="773" y="406" fill="#f2f3f5" font-size="19" font-weight="680">Boot</text>
    <text x="844" y="406" fill="#f2f3f5" font-size="19" font-weight="680">Gateway</text>
    <path d="M58 430H1142" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
