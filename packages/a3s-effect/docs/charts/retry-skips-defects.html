<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>A defect is not retried</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F0EFEB;--ink:#1C1C1A;--muted:#8F8E88;--faint:#C6C5BF;--grid:#DEDDD6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);font-family:'Inter',sans-serif;color:var(--ink);padding:40px;-webkit-font-smoothing:antialiased}
  .grid2{display:grid;grid-template-columns:1fr;gap:22px;max-width:720px;margin:0 auto}
  .card{background:var(--bg);border-radius:24px;padding:28px 28px 20px}
  h2{font-weight:700;font-size:16.5px;letter-spacing:-.02em;margin-bottom:3px}
  .sub{font-size:11.5px;color:var(--muted);margin-bottom:14px}
  .src{font-size:9.5px;color:var(--faint);margin-top:10px;letter-spacing:.08em;font-weight:500}
  svg{width:100%;height:auto;display:block;margin:0 auto}
  svg text{font-family:'Inter',sans-serif}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
</style>
</head>
<body>
<div class="grid2">
  <div class="card">
    <h2>A defect is not retried</h2>
    <div class="sub">faint = retries offered after the first failure · ink = executions · Exit::Fail versus Exit::Die</div>
    <svg id="ch" viewBox="0 0 400 320" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="src">F6 PAIRED RUNGS · A3S-EFFECT TESTS/EFFECT_OPS.RS · RETRY SCHEDULE</div>
  </div>
</div>
<script>
const INK='#1C1C1A',GRID='#DEDDD6';
const rnd=(i,k)=>Math.abs(((i*73856093)^(k*19349663))%1000)/1000;
const NS='http://www.w3.org/2000/svg';
const el=(p,t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);p.appendChild(n);return n};
const txt=(p,a,s)=>{const n=el(p,'text',a);n.textContent=s;return n};
const tip=(n,s)=>{const t=document.createElementNS(NS,'title');t.textContent=s;n.appendChild(t)};
const timers={};
const obsReveal=(id,fn)=>{
  const n=document.getElementById(id);
  const go=()=>{(timers[id]||[]).forEach(clearInterval);timers[id]=[];n.innerHTML='';fn(n)};
  const io=new IntersectionObserver(es=>{if(es[0].isIntersecting){go();io.disconnect()}},{threshold:.3});
  io.observe(n);n.style.cursor='pointer';n.addEventListener('click',go);
};
// F6 Paired Rungs. Left ladder = retries still offered. Right ladder = executions.
// Fail with one retry left runs twice. Die with three retries left runs once.
(()=>{
const D=[['FAIL',1,2],['DIE',3,1]];
obsReveal('ch',s=>{
  const x0=i=>130+i*140,base=258,step=52,HW=10;
  D.forEach(([name,offered,runs],i)=>{
    const xa=x0(i)-16,xb=x0(i)+16;
    for(let k=0;k<offered;k++){
      const y=base-k*step,w=HW-1.2+rnd(k+1,i+2)*2.4;
      el(s,'line',{x1:xa-w,y1:y,x2:xa+w,y2:y,stroke:'#B0AFA9','stroke-width':1.6,
        opacity:.55+rnd(k+2,i+3)*.35,class:'fade',style:`animation-delay:${i*.08+k*.04}s`});
    }
    for(let k=0;k<runs;k++){
      const y=base-k*step,w=HW-1.2+rnd(k+1,i+7)*2.4;
      el(s,'line',{x1:xb-w,y1:y,x2:xb+w,y2:y,stroke:INK,'stroke-width':1.8,
        opacity:.75,class:'fade',style:`animation-delay:${.15+i*.08+k*.04}s`});
    }
    const topB=base-(Math.max(runs,1)-1)*step;
    const num=txt(s,{x:xb,y:topB-12,'font-size':10.5,'font-weight':800,fill:INK,'text-anchor':'middle',
      class:'fade',style:`animation-delay:${.5+i*.08}s`},runs);
    tip(num,name==='FAIL'
      ?'Exit::Fail — one retry left, two executions'
      :'Exit::Die — three retries left, one execution');
    txt(s,{x:xa,y:base-(Math.max(offered,1)-1)*step-12,'font-size':8.5,'font-weight':700,fill:'#B0AFA9','text-anchor':'middle',
      class:'fade',style:`animation-delay:${.5+i*.08}s`},offered);
    txt(s,{x:x0(i),y:base+22,'font-size':8,'font-weight':700,fill:'#8F8E88','text-anchor':'middle',
      'letter-spacing':'.08em',class:'fade',style:`animation-delay:${i*.08}s`},name);
  });
  el(s,'line',{x1:30,y1:base+4,x2:370,y2:base+4,stroke:GRID,'stroke-width':.8,class:'fade'});
  txt(s,{x:200,y:306,'font-size':7,'font-weight':600,fill:'#B0AFA9','text-anchor':'middle',
    'letter-spacing':'.12em',class:'fade',style:'animation-delay:1s'},
    'FAINT = RETRIES OFFERED · INK = EXECUTIONS · ONE RUNG = ONE ATTEMPT');
});
})();
</script>
</body>
</html>
